    added_by: scout
    reason: Owns the current EMR implementation.
    evidence:
      - file: src/emr/MedicalRecord.ts
        lines: [12, 48]
        summary: Defines the source MedicalRecord model.
  - name: new-platform
    source: /home/user/code/new-platform
