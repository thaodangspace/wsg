name: OpenCode

on:
  workflow_dispatch:
  # Recover queued publication work if the original Actions run was interrupted.
  schedule:
    - cron: '*/15 * * * *'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Scheduled runs only drain previously authorized events; dispatch is drain-only.
    if: >-
      github.event_name == 'schedule' ||
      (github.actor == github.repository_owner &&
       (github.event_name == 'workflow_dispatch' ||
        github.event.comment.body == '/oc' ||
        startsWith(github.event.comment.body, '/oc ') ||
        github.event.comment.body == '/opencode' ||
        startsWith(github.event.comment.body, '/opencode ')))
    runs-on: self-hosted
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # No Actions concurrency group: it can drop pending comments. The durable
    # orchestrator queue and filesystem lock serialize work instead.
    steps:
      - uses: actions/checkout@v4
        with:
          # Always execute trusted default-branch orchestration, never PR code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install checksum-pinned OpenCode
        run: python3 .github/scripts/install_opencode.py
      - name: Run owner comment queue
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OC_STATE_DIR: ${{ vars.OC_STATE_DIR }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python3 -m core.github_opencode --drain
          else
            python3 -m core.github_opencode
          fi
