name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    # Supported environment: Node >=24, npm, git, and ripgrep. GitHub-hosted
    # ubuntu-latest is used so checks run without depending on the repo's
    # self-hosted runner being online.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=24"; exercise the floor and the current release.
        node: ['24', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install ripgrep (required by retrieval tests)
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          git --version
          rg --version
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Package install smoke (real tarball)
        run: npm run test:package
