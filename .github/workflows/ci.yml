name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    # Prefer GitHub-hosted runners; the repo also has a self-hosted Linux runner
    # available as a fallback if hosted minutes are exhausted.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=24"; exercise the floor and the current release.
        node: ['24', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          git --version
          (rg --version || echo 'ripgrep not installed; retrieval tests will report a bounded gap')
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Package install smoke (real tarball)
        run: npm run test:package
